name: native

# Runs the app on real Windows and macOS machines, so the OS-specific code -
# locking, process checks, the scheduler, the launchers - is executed rather
# than simulated. Only on code changes: in a private repository these runners
# draw down the free minutes faster than Linux ones.
on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - start.bat
      - start.command
      - tests/**
      - .github/workflows/native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp with its JavaScript runtime
        run: python -m pip install "yt-dlp[default,deno]"

      - name: Regression checks
        run: python tests/regression_check.py

      - name: Run the app's platform checks
        run: python tests/native_check.py
